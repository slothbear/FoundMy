name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode
        run: xcodebuild -version && xcodebuild -showsdks

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen

      # Builds the iPhone app, which also builds the watch app and the
      # Control Center button. Unsigned, so no Apple account is needed here.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Psst.xcodeproj \
            -scheme Psst \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E 'error:|warning:|ExtractAppIntentsMetadata|BUILD (SUCCEEDED|FAILED)' || true
          grep -q 'BUILD SUCCEEDED' build.log

      - name: Show what's inside the built app
        run: |
          app=$(find ~/Library/Developer/Xcode/DerivedData -path '*Release-iphoneos/Psst.app' -maxdepth 6 -type d | head -1)
          [ -n "$app" ] || app=$(find ~/Library/Developer/Xcode/DerivedData -name Psst.app -type d | grep iphoneos | head -1)
          echo "$app"
          find "$app" -name '*.app' -o -name '*.appex' | sed "s|$app|Psst.app|"
          ext=$(find "$app" -name '*.appex' | head -1)
          [ -n "$ext" ] && plutil -p "$ext/Info.plist" | grep -E 'NSExtension|Identifier|MinimumOS' || true
          find "$app" -name 'extract.actionsdata' -o -name 'Metadata.appintents' | sed "s|$app|Psst.app|"
